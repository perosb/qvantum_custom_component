name: Bug report
description: Report a problem with the Qvantum Heat Pump integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** include passwords, API tokens, or other secrets.

  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      description: How is the integration connected to the heat pump? (Settings → Devices & Services → Qvantum Heat Pump)
      options:
        - Cloud (HTTP)
        - Local Modbus (offline)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
        - Other
    validations:
      required: true

  - type: dropdown
    id: modbus_write
    attributes:
      label: Modbus writing
      description: Only relevant in Local Modbus mode. Choose N/A for Cloud (HTTP).
      options:
        - N/A (Cloud HTTP)
        - Disabled (read-only)
        - Enabled
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? Include Home Assistant version, integration version, expected behavior, and logs if you have them.
    validations:
      required: true
