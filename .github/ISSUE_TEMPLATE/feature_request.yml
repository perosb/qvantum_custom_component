name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      description: Which setup is this request about?
      options:
        - Cloud (HTTP)
        - Local Modbus (offline)
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What would you like to see, and why? Include Home Assistant version and integration version if relevant.
    validations:
      required: true
