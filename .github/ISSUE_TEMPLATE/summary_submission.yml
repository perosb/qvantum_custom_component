name: Summary submission
description: Send your installation summary so a rule can be checked across installations
title: "[summary] "
labels: ["summary"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Developer tools → Actions → qvantum.export_summary, then paste the result here.
      render: json
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Anything to add? (optional)
    validations:
      required: false
