name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no repository secrets, so the run would fail on the missing key.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The repository's tests require Python 3.14 (see test.yml), so the
      # review agent gets the same interpreter before it can run pytest.
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "**/requirements-test.txt"
      - uses: anomalyco/opencode/github@3a103fe0aff726a4edc7492f03f7b88195d9e4c9
        env:
          OPENCODE_CONFIG_CONTENT: ${{ vars.OPENCODE_CONFIG_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ github.event.pull_request.additions > 250 && 'openrouter/~z-ai/glm-latest' || 'openrouter/~z-ai/glm-flash-latest' }}
          variant: max
          share: false
          use_github_token: true
          prompt: |
            ${{ vars.OPENCODE_REVIEW_PROMPT }}
            