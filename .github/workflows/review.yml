name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no repository secrets, so the run would fail on the missing key.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The repository's tests require Python 3.14 (see test.yml), so the
      # review agent gets the same interpreter before it can run pytest.
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "**/requirements-test.txt"
      # Pinned to v1.18.32: the action receives a write-capable GITHUB_TOKEN.
      - uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4 # v1.18.32
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/~z-ai/glm-latest
          variant: max
          share: false
          use_github_token: true
          prompt: |
            Review this pull request following the review conventions in
            AGENTS.md ("Code reviews", "What to flag").

            Post immediately as a pull request review with event COMMENT.
            Do not approve, request changes, or leave the review pending.

            Inline comments:
            - Only on changed lines (diff RIGHT / new file).
            - Actionable: one or two sentences of why, then a concrete fix.
            - One issue per comment.

            GitHub apply-in-one-click suggestions:
            When the fix is a drop-in replacement of the exact line range you
            commented on, the comment body MUST end with a suggestion block
            and nothing after it:

            ```suggestion
            the full replacement text for those lines
            ```

            Rules for ```suggestion:
            - Fence language is exactly "suggestion" (not python, not diff).
            - The block is the new source only. No +/- prefixes, no surrounding
              explanation inside the fence.
            - It must replace the entire commented range 1:1: same number of
              leading spaces, same line endings. If you change three lines,
              the review comment must cover those three lines (start_line + line).
            - Do not put the suggestion only in the review summary.
            - Skip the suggestion block if the fix is not a literal line
              replacement (renames across files, new files, logic that needs
              more than the highlighted lines).
