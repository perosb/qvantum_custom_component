name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/releases/**"
  pull_request:
    # `labeled`/`unlabeled` so adding or removing the `docs-not-needed` opt-out
    # re-evaluates the documentation job without an empty commit.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  release:
    types: [published]

jobs:
  changes:
    # A docs-only change cannot break the integration, so the test matrix is
    # skipped for it: a prose fix should not wait for a two-minute install and
    # suite. `code` is true for any non-documentation file, and always true when
    # there is no PR to diff against (a push to main, a release).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -Ev '^(docs/|LICENSE$|[^/]+\.md$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    # Behaviour changes must carry their prose. The rule is deliberately coarse
    # (any documentation move satisfies it) because the judgement belongs to the
    # author; `docs-not-needed` opts out explicitly, which the job re-reads when
    # the label changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Documentation follows behaviour
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 .github/scripts/check_docs.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --labels-json "$PR_LABELS"

  test:
    needs: changes
    # Skipped only when every changed file is prose (docs/, *.md at the repo
    # root, LICENSE) — see the `changes` job. A skipped job is not a failure;
    # the ruleset requires no specific check.
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          # The patch-coverage gate diffs the changed lines against the pull
          # request's base commit, so the history has to be there.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "**/requirements-test.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          ./run-tests.sh

      - name: Coverage
        # Replaces the external Codecov app. The project floor is already
        # enforced by `pytest` (--cov-fail-under=92 in pytest.ini); what was
        # missing is the per-pull-request figure, which `diff-cover` reads from
        # the same `coverage.xml` by diffing against the PR's base commit. The
        # numbers go to the run summary (no app, no token, nothing to hang) and
        # the patch floor fails the job. A push to `main` has no base to diff
        # against, so it is report-only there.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATCH_FLOOR: "80"
        run: |
          python -m coverage report > "$RUNNER_TEMP/project.txt"
          if [ -z "$BASE_SHA" ]; then
            {
              echo "### Changed lines (patch)"
              echo
              echo "No pull-request base: the patch floor runs only on a pull request."
              echo
              echo "### Project"
              echo
              echo '```'
              cat "$RUNNER_TEMP/project.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          patch_status=0
          diff-cover coverage.xml --compare-branch "$BASE_SHA" \
            --fail-under "$PATCH_FLOOR" \
            --format json:"$RUNNER_TEMP/patch.json" || patch_status=$?
          python .github/scripts/coverage_summary.py \
            --json "$RUNNER_TEMP/patch.json" \
            --floor "$PATCH_FLOOR" \
            --project-report "$RUNNER_TEMP/project.txt" \
            >> "$GITHUB_STEP_SUMMARY" || patch_status=${patch_status:-1}
          exit "$patch_status"

  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - uses: "home-assistant/actions/hassfest@master"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
  dependabot:
    # `test` may be skipped (docs-only PR), which is why the condition below
    # does not require it to have run.
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
