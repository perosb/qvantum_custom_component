name: pi-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no repository secrets, so the run would fail on the missing key.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tooling-only PRs (just .github/**) skip the review: the reviewer would
      # otherwise review its own workflow/extension changes and re-open nits.
      # Also computes the reviewable addition count for model selection:
      # translations, tests, docs and .github inflate line counts without
      # adding review complexity, so they are kept out of that heuristic.
      - name: Check changed paths
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tooling_only=true
          review_additions=0
          while IFS=$'\t' read -r additions deletions file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/*) ;;
              *) tooling_only=false ;;
            esac
            case "$file" in
              custom_components/qvantum/translations/*|tests/*|docs/*|.github/*) continue ;;
            esac
            [ "$additions" = "-" ] && continue
            review_additions=$((review_additions + additions))
          done < <(git diff --numstat "${BASE_SHA}...${HEAD_SHA}")
          echo "tooling_only=$tooling_only" >> "$GITHUB_OUTPUT"
          echo "review_additions=$review_additions" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.changed.outputs.tooling_only != 'true'
        with:
          node-version: "24"

      - name: Cache npm (pi)
        if: steps.changed.outputs.tooling_only != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-pi-${{ runner.os }}-1.1.0

      - name: Install pi
        if: steps.changed.outputs.tooling_only != 'true'
        run: npm install -g @earendil-works/pi-coding-agent@1.1.0

      # Repo-owned extensions so CI matches local review runs. The guardrails
      # reference the OpenRouter account preset ("perosb") for ZDR/price-sorted
      # routing and cap max_completion_tokens so cheap providers (e.g. Relace)
      # stay eligible over 1M-context ones. The lookup tools give the reviewer
      # read-only, checkout-scoped verification without pi's built-in read/bash,
      # which a prompt-injected diff could use to reach credentials.
      - name: Install review extensions
        if: steps.changed.outputs.tooling_only != 'true'
        run: |
          mkdir -p ~/.pi/agent/extensions
          cp .github/pi/openrouter-guardrails.ts .github/pi/repo-lookup.ts ~/.pi/agent/extensions/

      - name: Build PR diff
        if: steps.changed.outputs.tooling_only != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --unified=8 "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff

      - name: Run pi review
        if: steps.changed.outputs.tooling_only != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Root the repo-scoped lookup tools at the checkout explicitly.
          PI_REVIEW_ROOT: ${{ github.workspace }}
          # Cost heuristic: pick the full model only when the reviewable source
          # diff is large. Translations, tests, docs and .github are excluded
          # from the count (see the changed-paths step) since they add volume,
          # not complexity.
          PI_MODEL: ${{ steps.changed.outputs.review_additions > 250 && 'openrouter/~z-ai/glm-latest' || 'openrouter/~z-ai/glm-flash-latest' }}
        run: |
          # Replace pi's coding-assistant system prompt: it advertises pi's own
          # docs and a broad tool set, which makes a review run wander instead
          # of returning the review JSON. Only the two repo-scoped lookup tools
          # stay enabled, so the reviewer can verify a claim but cannot read
          # credentials or run commands.
          cat /tmp/pr.diff | pi --provider openrouter --model "$PI_MODEL" \
            --thinking high \
            --system-prompt "$(cat .github/pi/review-prompt.md)" \
            -p --no-session --tools repo_grep,repo_read --mode json > /tmp/pi-events.jsonl
          [ -s /tmp/pi-events.jsonl ]

      - name: Post GitHub review
        if: steps.changed.outputs.tooling_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PI_REVIEW_MIN_SEVERITY: high
        run: |
          python3 .github/pi/post_review.py /tmp/pi-events.jsonl \
            "${{ github.event.pull_request.number }}" --head-sha "$HEAD_SHA"
