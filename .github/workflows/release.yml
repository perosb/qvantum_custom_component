name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and bump the manifest for (recovery)"
        required: true
        type: string
  release:
    # `published` fires for a release that goes live, stable or pre-release.
    # `released` fires when a pre-release is promoted to a stable release
    # afterwards, and `edited` covers a promotion GitHub reports as an edit
    # only. Publishing the draft as a pre-release and promoting it later is the
    # normal path here, so without the last two the manifest would never be
    # bumped and the release would ship the previous version.
    types: [published, released, edited]

env:
  COMPONENT_DIR: qvantum
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

# Serialize with any other automation that writes to main.
concurrency:
  group: main-release-automation
  cancel-in-progress: false

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          fetch-depth: 0

      # The event payload freezes the state at publish time: a promotion made
      # afterwards still arrives as `prerelease: true`, and an edit carries no
      # usable flag at all. Ask the API what the release is *now*. A manual run
      # is an explicit recovery of an already stable release.
      - name: Resolve whether the release is stable
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease=$(gh api "repos/${{ github.repository }}/releases/tags/${{ env.RELEASE_TAG }}" --jq '.prerelease')
          echo "stable=$([ "$prerelease" = "false" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Build the commit on the branch tip, never on the tag. A promotion
      # regenerates notes that the pre-release run already committed, so a
      # tag-based commit rebased onto main conflicts on `docs/releases/<tag>.md`
      # (2026.10.10, run 39277702885). Starting from main also makes the notes
      # index see the tree it is actually published into.
      - name: Move to the branch tip
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          git checkout -B release-build "origin/$branch"

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/generate_release_changelog.py \
            --tag "${{ env.RELEASE_TAG }}" \
            --out "docs/releases/${{ env.RELEASE_TAG }}.md" \
            --polish \
            --themed

      # A pre-release must not move the manifest / VERSION on main; only a
      # stable release commits this bump. The script fails the run if the
      # version it wrote is not the tag, so a broken path or a stale pattern
      # cannot ship a release that advertises the wrong version.
      - name: Update manifest.json version to ${{ env.RELEASE_TAG }}
        if: steps.release_state.outputs.stable == 'true'
        run: |
          python3 ${{ github.workspace }}/.github/scripts/update_hacs_manifest.py --version ${{ env.RELEASE_TAG }} --path /custom_components/qvantum/

      - name: Set up SSH deploy key
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Build the commit on top of origin/main (fast-forward) and push over SSH,
      # so the repository rule requiring pull requests does not reject it.
      - name: Commit manifest and release notes
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.release_state.outputs.stable }}" = "true" ]; then
            git add ./custom_components/qvantum/manifest.json ./custom_components/qvantum/const.py
          fi
          if [ -d docs/releases ]; then
            git add docs/releases
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          # Name the commit after what it actually carries: the version bump is
          # what main must show, a notes-only change is documentation.
          if git diff --cached --quiet -- ./custom_components/qvantum/manifest.json; then
            git commit -m "docs: release notes for ${{ env.RELEASE_TAG }}"
          else
            git commit -m "Update for new version ${{ env.RELEASE_TAG }}"
          fi

          # The commit was built on the branch tip, so this is normally a
          # no-op; a conflict means main moved underneath the run and the
          # notes must be regenerated rather than force-pushed.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::error::main moved during the run; rerun the workflow"
            exit 1
          fi
          git push origin HEAD:main

      # An edit is not a new publication: leave the body the run already wrote
      # alone, so a hand-written note is not overwritten by a stray edit.
      - name: Link the release notes
        if: github.event_name == 'release' && github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_release_changelog.py \
            --tag "${{ env.RELEASE_TAG }}" \
            --link-only

      # The asset is the tag, not the branch tip: the commit above is a change
      # *to main*, while the zip must contain what was tagged. Without this the
      # promotion/recovery runs would ship main-tip code under the tag version.
      - name: Check out the tag for the asset
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          git checkout --force --detach "${{ env.RELEASE_TAG }}"

      # Stamp the checkout with the tag even when it is not committed, so a
      # pre-release asset carries its own version instead of the previous stable
      # one (2026.10.9's zip advertising 2026.10.8). It runs after the commit
      # step on purpose — a modified file would block the rebase — and is
      # idempotent, so a stable run just rewrites the same version.
      - name: Stamp the zip with its own version
        run: |
          python3 ${{ github.workspace }}/.github/scripts/update_hacs_manifest.py --version ${{ env.RELEASE_TAG }} --path /custom_components/qvantum/

      - name: Create zip
        run: |
          cd custom_components/qvantum
          zip qvantum.zip -r ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/qvantum/qvantum.zip
          asset_name: qvantum.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true