name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  COMPONENT_DIR: qvantum

# Serialize with any other automation that writes to main.
concurrency:
  group: main-release-automation
  cancel-in-progress: false

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/generate_release_changelog.py \
            --tag "${{ github.event.release.tag_name }}" \
            --out "docs/releases/${{ github.event.release.tag_name }}.md" \
            --polish \
            --themed

      # A pre-release must not move the manifest / VERSION on main.
      - name: Update manifest.json version to ${{ github.event.release.tag_name }}
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: |
          python3 ${{ github.workspace }}/.github/scripts/update_hacs_manifest.py --version ${{ github.event.release.tag_name }} --path /custom_components/qvantum/

      - name: Set up SSH deploy key
        if: github.event_name == 'release'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Build the commit on top of origin/main (fast-forward) and push over SSH,
      # so the repository rule requiring pull requests does not reject it.
      - name: Commit manifest and release notes
        if: github.event_name == 'release'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            git add ./custom_components/qvantum/manifest.json ./custom_components/qvantum/const.py
          fi
          if [ -d docs/releases ]; then
            git add docs/releases
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            git commit -m "docs: release notes for ${{ github.event.release.tag_name }}"
          else
            git commit -m "Update for new version ${{ github.event.release.tag_name }}"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Link the release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_release_changelog.py \
            --tag "${{ github.event.release.tag_name }}" \
            --link-only

      - name: Create zip
        run: |
          cd custom_components/qvantum
          zip qvantum.zip -r ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/qvantum/qvantum.zip
          asset_name: qvantum.zip
          tag: ${{ github.ref }}
          overwrite: true