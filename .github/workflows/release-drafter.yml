name: Release Drafter

on:
  # Manual dispatch so the draft can be regenerated on demand: it only updates
  # from a push run, and a missed push event (seen on 2026-10-21: three merges
  # to main produced no runs at all) leaves the draft listing stale for as long
  # as nothing else lands.
  workflow_dispatch:
  push:
    branches:
      - main
      - drafter
    paths-ignore:
      # A docs-only release-notes commit (pre-releases bump no manifest) must
      # not re-trigger the drafter and create another draft with the same PRs.
      - "docs/releases/**"

permissions:
  contents: read

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: write
      issues: write

    name: Release Drafter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: calver
          increment: patch

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7.2.0
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          include-pre-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
