include-pre-releases: false
change-template: "- #$NUMBER $TITLE @$AUTHOR"
sort-direction: ascending
template: |
  # What's Changed

  $CHANGES


  > [!IMPORTANT]
  > Setup is **cloud HTTP** or **local Modbus**. Local Modbus is read-only until writing is enabled.
  > SmartControl and elevate-access stay cloud-only.


  > [!WARNING]
  > Elevate access assigns "Remote Service" (service tech) rights to your user. Cloud HTTP only.


  > [!CAUTION]
  > Cloud mode uses the same internal API as the app. Use at your own risk ;)

include-labels:
  - "bug"
  - "enhancement"
  - "chore"
categories:
  - title: "New features"
    label: "enhancement"

  - title: "Bug fixes"
    label: "bug"

  - title: "Chores"
    label: "chore"
