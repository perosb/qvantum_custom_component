; Static types where they pay: the seven Home-Assistant-free modules. A type
; error in these becomes a wrong number in the pump's curve or the solar term,
; not a missing field in a report — which is why they are held to a checker and
; the HA-facing modules are not (their `getattr(coordinator, name, None)` reads
; are deliberately defensive, and the export/dump parity test guards the class
; of bug they actually suffer from).
[mypy]
python_version = 3.14
files = custom_components/qvantum/numeric.py,
    custom_components/qvantum/efficiency.py,
    custom_components/qvantum/building.py,
    custom_components/qvantum/dhw_loss.py,
    custom_components/qvantum/plant_analytics.py,
    custom_components/qvantum/heating_curve.py,
    custom_components/qvantum/solar_gain.py
; The pure modules do not import Home Assistant, so their own imports resolve;
; anything outside (a client constant) is skipped rather than followed.
follow_imports = skip
warn_unused_ignores = true
warn_redundant_casts = true
