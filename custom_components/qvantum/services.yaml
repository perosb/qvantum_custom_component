extra_hot_water:
  name: extra_hot_water
  description: >-
    Additional hot water mode. Turned on explicitly, turned off by a timer.
  fields:
    device_id:
      description: The Qvantum device id
      example: "3010100111111111"

    minutes:
      description: Minutes to produce extra hot water (0 minutes turns off)
      example: "120"

set_curve_control:
  name: set_curve_control
  description: >-
    Adaptive heating-curve control mode. "shadow" only computes and logs the
    curve; "active" writes the seven points and switches the pump to User
    defined. Modbus only, and only one of the two modes is ever active.
  fields:
    mode:
      description: Mode to apply
      example: shadow
      selector:
        select:
          options:
            - shadow
            - active

set_curve_terms:
  name: set_curve_terms
  description: >-
    Optional adaptive heating-curve control terms. Solar is on by default (it
    lowers the supply by an identified solar gain); COP feedback, pre-charge
    and wind are off by default. COP feedback reduces the computed supply when
    the measured COP falls below its learned reference; pre-charge raises it
    ahead of a forecast cold snap; wind raises it while a wind sensitivity
    identified for this installation reports extra envelope loss. The same
    switches are in the integration's Configure dialog. Modbus only, and the
    terms only act while the curve is active.
  fields:
    solar:
      description: >-
        Enable or disable the solar term. On by default; it only acts while
        this installation's aperture passed its gates.
      example: true
      selector:
        boolean:

    cop_feedback:
      description: Enable or disable the COP-feedback term
      example: true
      selector:
        boolean:

    precharge:
      description: Enable or disable the cold-snap pre-charge term
      example: true
      selector:
        boolean:

    wind:
      description: >-
        Enable or disable the wind term. It only acts while this
        installation's history can identify a wind coefficient.
      example: false
      selector:
        boolean:

recalibrate:
  name: recalibrate
  description: >-
    Re-run the day-block calibration now instead of waiting for the next
    attempt (at most once a day). Identifies the solar aperture and the wind
    column from the recorder history and Open-Meteo; it writes nothing to the
    heat pump. Modbus only.

export_summary:
  name: export_summary
  description: >-
    Write an opt-in summary of the installation to
    config/qvantum_summary.json and return it, so it can be attached to a
    GitHub issue when a rule needs checking across installations. It contains
    device metadata, control-loop settings, the identified parameters and the
    derived verdicts — never entity ids, names, coordinates or raw series.
    The same payload can be downloaded from /api/qvantum/summary while logged
    in. Nothing is sent anywhere and no issue is opened for you.

telemetry_upload:
  name: telemetry_upload
  description: >-
    Posts the anonymous summary immediately instead of waiting for the weekly
    upload. Does nothing unless sharing was granted in the repair prompt.

telemetry_delete:
  name: telemetry_delete
  description: >-
    Erases every uploaded summary row for this installation, using the local
    installation token. Sharing stops only when it is also turned off in the
    integration's settings.
