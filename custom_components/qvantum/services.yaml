extra_hot_water:
  name: extra_hot_water
  description: >-
    Additional hot water mode. Turned on explicitly, turned off by a timer.
  fields:
    device_id:
      description: The Qvantum device id
      example: "3010100111111111"

    minutes:
      description: Minutes to produce extra hot water (0 minutes turns off)
      example: "120"

set_curve_control:
  name: set_curve_control
  description: >-
    Adaptive heating-curve control mode. "shadow" only computes and logs the
    curve; "active" writes the seven points and switches the pump to User
    defined. Modbus only, and only one of the two modes is ever active.
  fields:
    mode:
      description: Mode to apply
      example: shadow
      selector:
        select:
          options:
            - shadow
            - active

set_curve_terms:
  name: set_curve_terms
  description: >-
    Optional adaptive heating-curve control terms, off by default. COP
    feedback reduces the computed supply when the measured COP falls below
    its learned reference; pre-charge raises it ahead of a forecast cold
    snap. Modbus only, and the terms only act while the curve is active.
  fields:
    cop_feedback:
      description: Enable or disable the COP-feedback term
      example: true
      selector:
        boolean:

    precharge:
      description: Enable or disable the cold-snap pre-charge term
      example: true
      selector:
        boolean:

export_summary:
  name: export_summary
  description: >-
    Write an opt-in summary of the installation to
    config/qvantum_summary.json and return it, so it can be attached to a
    GitHub issue when a rule needs checking across installations. It contains
    device metadata, control-loop settings, the identified parameters and the
    derived verdicts — never entity ids, names, coordinates or raw series.
    The same payload can be downloaded from /api/qvantum/summary while logged
    in. Nothing is sent anywhere and no issue is opened for you.

telemetry_upload:
  name: telemetry_upload
  description: >-
    Posts the anonymous summary immediately instead of waiting for the weekly
    upload. Does nothing unless sharing was granted in the repair prompt.

telemetry_delete:
  name: telemetry_delete
  description: >-
    Erases every uploaded summary row for this installation, using the local
    installation token. Sharing stops only when it is also turned off in the
    integration's settings.
